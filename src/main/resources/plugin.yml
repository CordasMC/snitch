name: Snitch
version: 1.0.0
api-version: 26.1
main: dev.jstus.snitch.Snitch
paper-plugin-loader: dev.jstus.snitch.SnitchLoader
folia-supported: true
authors: [Justus]
softdepend: [LiteBans]

permissions:
  snitch.report:
    description: File a report with /reportcheating
    default: true
  snitch.command:
    description: Grants every /snitch subcommand
    default: op
    children:
      snitch.menu: true
      snitch.resolvecase: true
      snitch.shadowban: true
  snitch.menu:
    description: Open the case overview with /snitch menu
    default: op
  snitch.resolvecase:
    description: Resolve a case with /snitch resolvecase
    default: op
  snitch.shadowban:
    description: Add or remove a shadow ban with /snitch shadowban
    default: op
